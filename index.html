
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>TAKSH</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101827;color:white;
 font-family:Arial,sans-serif;padding-bottom:80px
}
header{
 padding:25px 20px;background:#17243a;
 border-radius:0 0 25px 25px
}
.logo{color:#ffb52e;font-size:30px;font-weight:bold}
header p{color:#bdc8d8;margin-bottom:0}
h2{margin:25px 20px 12px}
.grid{
 display:grid;grid-template-columns:1fr 1fr;
 gap:13px;padding:0 16px
}
.card{
 background:#1d2d46;padding:22px 12px;
 border-radius:17px;text-align:center;
 border:1px solid #34445e
}
.card span{font-size:30px}
.card h3{font-size:16px;margin:10px 0 5px}
.card p{font-size:12px;color:#b8c5d6;margin:0}
.welcome{
 margin:20px 16px;padding:20px;
 background:linear-gradient(120deg,#d97706,#fbbf24);
 color:#111827;border-radius:18px
}
button{
 border:0;border-radius:10px;padding:12px 18px;
 background:#111827;color:white;font-weight:bold
}
nav{
 position:fixed;bottom:0;left:0;width:100%;
 display:flex;justify-content:space-around;
 background:#17243a;padding:15px
}
nav button{background:transparent;color:white}
#notice{padding:0 20px;color:#ffca60}
</style>
</head>
<body>
<header>
 <div class="logo">⚡ TAKSH</div>
 <p>आपका अपना डिजिटल संसार</p>
</header>

<div class="welcome">
 <h2>Welcome to TAKSH!</h2>
 <p>नई शुरुआत, नए सपने।</p>
 <button onclick="alert('TAKSH में आपका स्वागत है!')">
 शुरू करें
 </button>
</div>

<h2>Explore TAKSH</h2>
<div class="grid">
 <div class="card">
  <span>🎮</span>
  <h3>Games</h3>
  <p>खेल और मनोरंजन</p>
 </div>
 <div class="card">
  <span>📚</span>
  <h3>Learning</h3>
  <p>कुछ नया सीखें</p>
 </div>
 <div class="card">
  <span>💰</span>
  <h3>Earn</h3>
  <p>कमाई की जानकारी</p>
 </div>
 <div class="card">
  <span>👤</span>
  <h3>Profile</h3>
  <p>आपकी प्रोफाइल</p>
 </div>
</div>

<h2>About TAKSH</h2>
<p style="padding:0 20px;color:#bdc8d8">
 TAKSH एक शुरुआती मोबाइल ऐप प्रोजेक्ट है।
 इसे हम धीरे-धीरे और बेहतर बनाएंगे।
</p>
<p id="notice"></p>

<nav>
 <button onclick="window.scrollTo(0,0)">🏠 Home</button>
 <button onclick="alert('Profile जल्द आएगी!')">👤 Profile</button>
</nav>

<script>
if ('serviceWorker' in navigator) {
 window.addEventListener('load',()=>{
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
 });
}
</script>
</body>
</html>
